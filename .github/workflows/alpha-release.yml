name: alpha-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create (prerelease)
        default: v0.1.0-alpha
jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Create the Release from a machine with gh:"
          echo "gh release create ${{ github.event.inputs.tag }} --notes-file ALPHA.md --prerelease"
